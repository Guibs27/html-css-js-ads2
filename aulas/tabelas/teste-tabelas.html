<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabelas</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <table>
    <tr>
      <th colspan="3">Cidades por Região</th>
    </tr>

    <tr>
      <th>Estado</th>
      <th>Região</th>
      <th>Cidade</th>
    </tr>

    <tr>
      <td rowspan="10">São Paulo</td>
    </tr>

    <tr>
      <td rowspan="5">Litoral Norte</td>
    </tr>
    <tr>
      <td>Caraguatatuba</td>
    </tr>
    <tr>
      <td>Ubatuba</td>
    </tr>
    <tr>
      <td>Ilhabela</td>
    </tr>
    <tr>
      <td>São Sebastião</td>
    </tr>

    <tr>
      <td rowspan="4">Vale do Paraíba</td>
    </tr>
    <tr>
      <td>São José dos Campos</td>
    </tr>
    <tr>
      <td>Taubaté</td>
    </tr>
    <tr>
      <td>Guaratinguetá</td>
    </tr>
  </table>

  <table>
    <tr>
      <th colspan="6">XXXX</th>
    </tr>

    <tr>
      <th colspan="3">AAAA</th>
      <th colspan="3">BBBB</th>
    </tr>

    <tr>
      <th rowspan="4">CCCC</th>
    </tr>

    <tr>
      <th colspan="2">DDDD</th>
      <th colspan="2">EEEE</th>
      <th rowspan="4">FFFF</th>
    </tr>
    <tr>
      <td>XXXX</td>
      <td>XXXX</td>
      <td>XXXX</td>
    </tr>

    <tr>
      <td>XXXX</td>
      <td>XXXX</td>
      <td>XXXX</td>
    </tr>
  </table>
</body>

</html>
