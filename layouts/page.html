<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout com divs</title>
  <link rel="stylesheet" href="css/style5.css">
</head>

<body>
  <div id="header">
    <div class="circle"></div>
    <div class="shape nav" style="width: 500px;"></div>
  </div>

  <div id="hero" style="flex-direction: column; justify-content: center;">
    <div class="shape retanG"></div>
    <div class="shape retanP"></div>
  </div>

  <div class="section bg-yellow">
    <div class="shape quadG"></div>
    <div class="shape quadG"></div>
    <div class="shape quadG"></div>
  </div>

  <div class="section">
    <div class="shape quadG"></div>
    <div class="block">
      <div class="shape retanG"></div>
      <div class="shape retanP"></div>
    </div>
  </div>

  <div class="section bg-yellow">
    <div class="shape retanG">
      <div class="circle"></div>
      <div class="shape retanP"></div>
    </div>

    <div class="shape retanG">
      <div class="circle"></div>
      <div class="shape retanP"></div>
    </div>
  </div>

  <div class="section">
    <div class="shape retanG" style="width: 160px; height: 260px;"></div>
    <div class="shape retanG" style="width: 160px; height: 260px;"></div>

    <div class="block" style="height: 280px; justify-content: space-between;">
      <div class="shape retanP" style="height: 80px;"></div>
      <div class="shape retanP" style="height: 80px;"></div>
    </div>
  </div>

  <div id="footer"></div>
</body>

</html>
