<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuantIF</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <div class="wrapper">
      <div id="logo">
        <img src="img/vecteezy_foreign-investment-vector-icon-design_16421645.svg" alt="Logo QuantIF">
        <h1>Quant<span>IF</span></h1>
      </div>

      <nav>
        <ul>
          <li><a href="./index.html" class="active">Início</a></li>
          <li><a href="./bolsas.html">Bolsas</a></li>
          <li><a href="./cadastro.html" class="signup-button">Cadastre-se</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrapper">
      <h1>Bem-vindo ao QuantIF.</h1>

      <div class="stockList">
        <div class="stockCard">
          <div class="stockHeader">
            <div>
              <h2>APPL</h2>
              <span>Apple Inc.</span>
            </div>
            <div>
              <span class="stockValue up">USD 100.00</span>
            </div>
          </div>

          <div class="stockDetails">
            <span><b>5</b> ações</span>
            <div>
              <span>Total</span>
              <span class="stockValue">USD 500.00</span>
            </div>
          </div>
        </div>

        <div class="stockCard">
          <div class="stockHeader">
            <div>
              <h2>APPL</h2>
              <span>Apple Inc.</span>
            </div>
            <div>
              <span class="stockValue up">USD 100.00</span>
            </div>
          </div>

          <div class="stockDetails">
            <span><b>5</b> ações</span>
            <div>
              <span>Total</span>
              <span class="stockValue">USD 500.00</span>
            </div>
          </div>
        </div>

        <div class="stockCard">
          <div class="stockHeader">
            <div>
              <h2>APPL</h2>
              <span>Apple Inc.</span>
            </div>
            <div>
              <span class="stockValue up">USD 100.00</span>
            </div>
          </div>

          <div class="stockDetails">
            <span><b>5</b> ações</span>
            <div>
              <span>Total</span>
              <span class="stockValue">USD 500.00</span>
            </div>
          </div>
        </div>
      </div>

      <button class="add-button" onclick="openModal('addStockModal')">Add Stock</button>
      <div class="center-content modal" id="addStockModal">
        <form action="#" method="POST" id="addStockForm">
          <h2>Adicionar Ação</h2>
        
          <label for="stockTicker">Código da Ação:</label>
          <input type="text" id="stockTicker" name="stockTicker" placeholder="Ex: AAPL" required>
          <label for="stockName">Nome da Ação:</label>
          <input type="text" id="stockName" name="stockName" placeholder="Ex: Apple Inc.">
          <label for="stockValue">Preço da Ação:</label>
          <input type="number" id="stockValue" name="stockValue" placeholder="Ex: 150.00" step="0.01">
          <label for="stockQuantity">Quantidade:</label>
          <input type="number" id="stockQuantity" name="stockQuantity" placeholder="Ex: 100">

          <input class="add-button" type="submit" value="Adicionar Ação">
          <button class="add-button" onclick="closeModal('addStockModal')">Fechar</button>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrapper">
    </div>
  </footer>
</body>

<script src="./js/main.js"></script>
</html>
