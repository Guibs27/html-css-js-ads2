<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuantIF</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <div class="wrapper">
      <div id="logo">
        <img src="img/vecteezy_foreign-investment-vector-icon-design_16421645.svg" alt="Logo IF Investments">
        <h1>Quant<span>IF</span></h1>
      </div>

      <nav>
        <ul>
          <li><a href="./index.html">Início</a></li>
          <li><a href="./bolsas.html">Bolsas</a></li>
          <li><a href="./cadastro.html" class="active">Cadastro</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrapper center-content">
      <form action="#" method="POST">
        <span>Investir nunca foi tão simples. <b>Crie sua conta.</b></span>

        <fieldset>
          <legend>Informações Pessoais</legend>

          <div class="field-group">
            <label>
              Nome
              <input type="text" name="nameUser" placeholder="Nome" required>
            </label>
            <label>
              Sobrenome
              <input type="text" name="surnameUser" placeholder="Sobrenome" required>
            </label>
          </div>

          <label>
            E-mail
            <input type="email" name="emailUser" placeholder="E-mail" required>
          </label>

          <label>
            Senha
            <input type="password" name="passwordUser" placeholder="Senha" required>
          </label>
        </fieldset>

        <fieldset>
          <legend>Qual o seu perfil de investidor?</legend>
          <label class="inline-option">
            <input type="radio" name="perfilUser" value="pC" required> Conservador
          </label>
          <label class="inline-option">
            <input type="radio" name="perfilUser" value="pM" required> Moderado
          </label>
          <label class="inline-option">
            <input type="radio" name="perfilUser" value="pA" required> Agressivo
          </label>
        </fieldset>

        <fieldset>
          <legend>Quais são suas preferências de investimento?</legend>
          <label class="inline-option">
            <input type="checkbox" name="prefUser" value="ac"> Ações
          </label>
          <label class="inline-option">
            <input type="checkbox" name="prefUser" value="fu"> Fundos
          </label>
          <label class="inline-option">
            <input type="checkbox" name="prefUser" value="rf"> Renda Fixa
          </label>
          <label class="inline-option">
            <input type="checkbox" name="prefUser" value="cm"> Criptomoedas
          </label>
        </fieldset>

        <input type="submit" value="Cadastrar">
      </form>
    </div>
  </main>

  <footer>
    <div class="wrapper">
    </div>
  </footer>
</body>

</html>
